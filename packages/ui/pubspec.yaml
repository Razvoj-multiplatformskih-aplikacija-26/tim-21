name: ui
description: BoardGame Booking theme, fonts and shared widgets for the Flutter clients.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  design_tokens:
    path: ../design_tokens
  domain:
    path: ../domain
  flutter:
    sdk: flutter
  intl: 0.20.3

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
